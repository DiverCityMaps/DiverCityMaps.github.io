<!DOCTYPE HTML>
<html>
<head>
	<title>DiverCity</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css"/>
	<link rel="stylesheet" href="assets/css/nav.css"/>
	<link rel="stylesheet" href="assets/css/spinner.css"/>
	<noscript><link rel="stylesheet" href="assets/css/noscript.css"/></noscript>
</head>
<body style="overflow: hidden; height: 100%;">

	<nav id="nav">
		<ul>
			<li><a href="index.html">DiverCity</a></li>
			<li><a href="alternative_routes.html" class="active">Route Calculator</a></li>
			<li><a href="atlas.html">City Atlas</a></li>
		</ul>
	</nav>

	<!-- Loading overlay -->
	<div id="loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;
	background-color: rgba(255, 255, 255, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999;">
		<div class="spinner"></div>
	</div>

	<!-- Main -->
	<div id="main" style="overflow: hidden;">
		<iframe id="app-frame" src="leaflet_alternative_routes.html" style="width: 100%; height:calc(100vh - 60px - 1em); max-height: 100vh; border: 0;">
			Your browser does not support iframes.
		</iframe>
	</div>

	<script>
		// Hide loader as soon as iframe UI is mounted (before rome.js and
		// graph build), so users see the calculator interface instead of grey.
		(function () {
			var loader = document.getElementById('loader');
			var frame  = document.getElementById('app-frame');
			var hidden = false;
			function hide() {
				if (hidden) return;
				hidden = true;
				if (loader) loader.style.display = 'none';
			}
			window.addEventListener('message', function (e) {
				if (e.data === 'ui-ready') hide();
			});
			if (frame) frame.addEventListener('load', hide);   // fallback
		})();
	</script>

	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.scrollex.min.js"></script>
	<script src="assets/js/jquery.scrolly.min.js"></script>
	<script src="assets/js/browser.min.js"></script>
	<script src="assets/js/breakpoints.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>

</body>
</html>
